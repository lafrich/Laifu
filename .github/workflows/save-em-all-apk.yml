name: Save em all APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/save-em-all/**'
      - '.github/workflows/save-em-all-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Save em all debug APK
        run: gradle -p apps/save-em-all :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-em-all-debug-apk
          path: apps/save-em-all/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Prepare directly downloadable APK
        run: |
          cp apps/save-em-all/app/build/outputs/apk/debug/app-debug.apk Save-em-all-v0.4.0.apk
      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: save-em-all-v0.4.0
          name: "Save em all by Lafrich v0.4.0"
          body: |
            Android APK. yt-dlp automatic/manual updates and HTTP(S)/SOCKS proxy support.
            Download the APK asset directly below to install on Android 10+.
            This is a debug-signed APK; uninstall may be required if switching debug signing keys.
          files: Save-em-all-v0.4.0.apk
          fail_on_unmatched_files: true
          overwrite_files: true
