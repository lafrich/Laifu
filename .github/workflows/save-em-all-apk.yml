name: Save em all APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/save-em-all/**'
      - '.github/workflows/save-em-all-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle newest official yt-dlp nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yt-dlp/yt-dlp-nightly-builds/releases/latest)
          tag=$(echo "$release_json" | jq -r '.tag_name')
          media_url=$(echo "$release_json" | jq -r '.assets[] | select(.name == "yt-dlp") | .browser_download_url')
          [[ "$tag" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{6}$ ]]
          [[ "$media_url" == https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/* ]]
          mkdir -p apps/save-em-all/app/src/main/res/raw
          mkdir -p apps/save-em-all/app/src/main/assets
          curl -fL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$media_url" -o apps/save-em-all/app/src/main/res/raw/ytdlp
          python3 -m zipfile -t apps/save-em-all/app/src/main/res/raw/ytdlp
          test "$(stat -c%s apps/save-em-all/app/src/main/res/raw/ytdlp)" -gt 50000
          printf '%s\n' "$tag" > apps/save-em-all/app/src/main/assets/save_em_all_ytdlp_version.txt
          echo "Bundled official yt-dlp nightly $tag"
      - name: Build Save em all debug APK
        run: gradle -p apps/save-em-all :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: save-em-all-debug-apk
          path: apps/save-em-all/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Prepare directly downloadable APK
        run: |
          cp apps/save-em-all/app/build/outputs/apk/debug/app-debug.apk Save-em-all-v0.7.0.apk
      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: save-em-all-v0.7.0
          name: "Save em all by Lafrich v0.7.0"
          body: |
            Android APK with current official yt-dlp nightly bundled and tested on Android runtime, fixed engine updates, and existing Vidara, WEB capture and queue support.
            Download the APK asset directly below to install on Android 10+.
            This is a debug-signed APK; uninstall may be required if switching debug signing keys.
          files: Save-em-all-v0.7.0.apk
          fail_on_unmatched_files: true
          overwrite_files: true
