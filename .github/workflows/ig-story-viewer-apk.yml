name: IG Story Viewer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ig-story-viewer/**'
      - '.github/workflows/ig-story-viewer-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android APK
        run: gradle -p apps/ig-story-viewer :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp apps/ig-story-viewer/app/build/outputs/apk/debug/app-debug.apk IG-Story-Viewer-by-Lafrich.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ig-story-viewer-apk
          path: IG-Story-Viewer-by-Lafrich.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ig-story-viewer-v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" IG-Story-Viewer-by-Lafrich.apk --clobber
          else
            gh release create "$TAG" IG-Story-Viewer-by-Lafrich.apk --title "IG Story Viewer by Lafrich v0.1.0" --notes "Android viewer for public Instagram Stories. Unofficial third-party viewer wrapper." --latest=false
          fi
