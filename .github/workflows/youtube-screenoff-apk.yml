name: YouTube Screen Off APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/youtube-screenoff/**'
      - '.github/workflows/youtube-screenoff-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        run: gradle -p apps/youtube-screenoff :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-screenoff-debug-apk
          path: apps/youtube-screenoff/app/build/outputs/apk/debug/app-debug.apk
